services:
  - type: web
    name: studentportal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: StudentHub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Karachi
      # APP_KEY Render dashboard se daalein: php artisan key:generate --show ka output
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: studentportal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studentportal-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: studentportal-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: studentportal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: studentportal-db
          property: password
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: studentportal-db
    plan: free
    databaseName: studentportal
    user: sp_user
